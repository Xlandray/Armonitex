server {
    listen 80;
    server_name armonitex.com.tr www.armonitex.com.tr api.armonitex.com.tr admin.armonitex.com.tr;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name armonitex.com.tr www.armonitex.com.tr;

    ssl_certificate /etc/letsencrypt/live/armonitex.com.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/armonitex.com.tr/privkey.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

server {
    listen 443 ssl http2;
    server_name api.armonitex.com.tr;

    ssl_certificate /etc/letsencrypt/live/armonitex.com.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/armonitex.com.tr/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
