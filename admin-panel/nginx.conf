server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Panel bir SPA: /projects/show/<id> gibi yollar sunucuda dosya olarak
    # yoktur, istemci tarafinda React Router cozer. Bulunamayan her yol
    # index.html'e duser, yoksa sayfa yenilendiginde 404 alinir.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite varlik dosyalarina icerik hash'i koyar, bu yuzden sonsuza kadar
    # onbelleklenebilirler. index.html onbelleklenmemeli; yeni surumun hangi
    # varliklari yukleyecegini o soyluyor.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
