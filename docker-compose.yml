services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  migrate:
    build:
      context: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: &api_environment
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS must be set in .env}
      STORAGE_DIR: /app/storage
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "${API_PORT:-8080}:8000"
    environment: *api_environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./backend/app:/app/app
      - portal_storage:/app/storage

  admin-panel:
    build:
      context: ./admin-panel
    ports:
      - "${ADMIN_PORT:-5180}:5173"
    environment:
      VITE_API_URL: http://localhost:${API_PORT:-8080}/api/v1
    depends_on:
      api:
        condition: service_started
    volumes:
      - ./admin-panel/src:/app/src

  armonitex-web:
    build:
      context: ./armonitex-web
    ports:
      - "${WEB_PORT:-3005}:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000/api/v1
      # Server-side (route handlers, server components) reach the API over the internal network.
      API_URL: http://api:8000/api/v1
    depends_on:
      api:
        condition: service_started
    volumes:
      - ./armonitex-web/src:/app/src
      - ./armonitex-web/public:/app/public

volumes:
  postgres_data:
  portal_storage:
